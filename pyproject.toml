[project]
name = "artemis-scanner"
version = "2.0.0"
description = "Enterprise network vulnerability scanner and asset fingerprinting platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Trevor Capps", email = "trevor@chronos.host"},
]

dependencies = [
    "flask>=3.0",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "flask-sqlalchemy>=3.1",
    "flask-socketio>=5.3",
    "python-nmap>=0.7",
    "paramiko>=3.4",
    "matplotlib>=3.8",
    "mac-vendor-lookup>=0.1.12",
    "python-dotenv>=1.0",
    "croniter>=1.4",
    "celery[redis]>=5.4",
    "Flask-Migrate>=4.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "build>=1.2",
]
all = [
    "artemis-scanner[postgres,dev]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
