[project]
name = "artemis-scanner"
version = "2.0.0"
description = "Enterprise network vulnerability scanner and asset fingerprinting platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Trevor Capps", email = "trevor@chronos.host"},
]

dependencies = [
    "flask>=3.0",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "flask-sqlalchemy>=3.1",
    "flask-socketio>=5.3",
    "python-nmap>=0.7",
    "paramiko>=3.4",
    "matplotlib>=3.8",
    "mac-vendor-lookup>=0.1.12",
    "python-dotenv>=1.0",
    "croniter>=1.4",
    "celery[redis]>=5.4",
    "Flask-Migrate>=4.0",
    "apispec[yaml]>=6.3",
    "weasyprint>=62",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
# Production WSGI/websocket stack. The Docker image installs this in an earlier
# layer for caching; listing it here keeps pyproject the single source of truth.
wsgi = [
    "gunicorn>=21.2",
    "gevent>=24.2",
    "gevent-websocket>=0.10",
]
# Optional web-technology fingerprinting. wap_engine imports these lazily and
# degrades gracefully when they are absent, so they are not a core dependency.
fingerprint = [
    "python-Wappalyzer>=0.3.1",
    "requests>=2.31",
    "lxml>=5.1",
]
# Optional Ansible orchestration backend (Phase 5). The AutomationExecutor
# interface reports "unavailable" and every automation run is rejected when
# these are absent.
automation = [
    "ansible-core>=2.16",
    "ansible-runner>=2.4",
    "ansible-lint>=24.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "build>=1.2",
    "uv>=0.5",
]
all = [
    "artemis-scanner[postgres,wsgi,fingerprint,dev]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artemis*"]

[tool.setuptools.package-data]
artemis = ["automation_playbooks/*.yml"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["artemis", "agent"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
# Ratcheted per phase; never lower. P2 ~57%, P4.1 ~60%.
fail_under = 57
show_missing = true
