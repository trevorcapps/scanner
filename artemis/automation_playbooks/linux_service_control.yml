# starter: linux-service-control v1 — start/stop/restart a systemd unit
- hosts: targets
  gather_facts: false
  become: true
  tasks:
    - name: "{{ service_state | default('restarted') }} {{ service_name }}"
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: "{{ service_state | default('restarted') }}"
        enabled: "{{ service_enabled | default(omit) }}"
