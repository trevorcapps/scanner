name: Release

# Protected version tags only. Produces an immutable, signed image plus SBOMs
# and attaches them to the GitHub Release. It never deploys — deployment is a
# separate, manually approved workflow (see docs/RELEASING.md, decision D10).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # create the GitHub Release and upload assets
  packages: write      # push the image to GHCR
  id-token: write      # keyless cosign signing

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release      # requires the "release" environment's approval gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          test "$tag" = "$proj"

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Image SBOM (CycloneDX)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json

      - name: Python environment SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.lock -o sbom-python.cdx.json

      - name: Sign the SBOMs
        run: |
          cosign sign-blob --yes --output-signature sbom-image.cdx.json.sig sbom-image.cdx.json
          cosign sign-blob --yes --output-signature sbom-python.cdx.json.sig sbom-python.cdx.json

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            sbom-image.cdx.json
            sbom-image.cdx.json.sig
            sbom-python.cdx.json
            sbom-python.cdx.json.sig

      - name: Deployment reminder
        run: echo "Image published and signed. Deployment is a separate approved workflow (D10)."
