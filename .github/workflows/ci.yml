name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      FLASK_APP: run.py
      DATABASE_URL: sqlite:////tmp/artemis-ci.db
      DB_PATH: /tmp/artemis-ci.db
      AUTO_CREATE_SCHEMA: "false"
      INITIALIZE_LEGACY_SCHEMA: "false"
      START_BACKGROUND_SERVICES: "false"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check artemis agent tests --select E9,F63,F7,F82
      - name: Test
        run: pytest --cov=artemis --cov=agent --cov-report=term-missing --cov-report=xml
      - name: Verify migrations
        run: flask db upgrade
      - name: Build
        run: python -m build
