<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Crescent moon -->
  <path d="M 370 110 
           A 150 150 0 1 0 370 390 
           A 110 110 0 0 1 370 110 Z" 
        fill="#ff6b01" opacity="0.12"/>
  
  <!-- Bow arc -->
  <path d="M 155 75 
           Q 50 256 155 437" 
        stroke="#ff6b01" stroke-width="16" stroke-linecap="round" fill="none"/>
  
  <!-- Bowstring (resting) -->
  <line x1="155" y1="75" x2="155" y2="437" 
        stroke="#eaedf3" stroke-width="2.5" opacity="0.3"/>
  
  <!-- Bowstring pulled to nock -->
  <line x1="155" y1="195" x2="215" y2="256" 
        stroke="#eaedf3" stroke-width="2" opacity="0.4"/>
  <line x1="155" y1="317" x2="215" y2="256" 
        stroke="#eaedf3" stroke-width="2" opacity="0.4"/>
  
  <!-- Arrow shaft -->
  <line x1="215" y1="256" x2="435" y2="256" 
        stroke="#eaedf3" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Arrowhead -->
  <polygon points="435,256 410,238 416,252 410,252 410,260 416,260 410,274" 
           fill="#ff6b01"/>
  
  <!-- Fletching -->
  <line x1="225" y1="256" x2="238" y2="242" stroke="#ff6b01" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="231" y1="256" x2="244" y2="244" stroke="#ff6b01" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="225" y1="256" x2="238" y2="270" stroke="#ff6b01" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="231" y1="256" x2="244" y2="268" stroke="#ff6b01" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Crosshair reticle -->
  <circle cx="435" cy="256" r="30" stroke="#ff6b01" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="435" cy="256" r="17" stroke="#ff6b01" stroke-width="1.5" fill="none" opacity="0.3"/>
  <line x1="435" y1="220" x2="435" y2="232" stroke="#ff6b01" stroke-width="1.5" opacity="0.4"/>
  <line x1="435" y1="292" x2="435" y2="280" stroke="#ff6b01" stroke-width="1.5" opacity="0.4"/>
  <line x1="471" y1="256" x2="459" y2="256" stroke="#ff6b01" stroke-width="1.5" opacity="0.4"/>
</svg>